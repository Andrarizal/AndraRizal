name: Activity

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow and the font
        run: |
          pip install pillow
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Draw the contribution card
        run: python scripts/activity.py

      - name: Publish the images
        run: |
          git add assets/streak.png assets/snake.svg assets/snake-dark.svg
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh contribution counts, including private activity."
          git push
